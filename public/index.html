<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Budget Tracker</title>
<meta name="description" content="Track daily spending, stay inside your monthly budget.">
<meta name="theme-color" content="#f3f4f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#090a0f" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Budget">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div id="app" class="shell" hidden>
  <aside class="side">
    <div class="brand"><img src="/icons/icon-192.png" alt="" width="32" height="32"><span>Budget</span></div>
    <nav id="sidenav" aria-label="Main"></nav>
    <button class="btn primary add-desktop" data-action="add">＋ Add expense</button>
  </aside>
  <main>
    <header class="top">
      <div class="titles">
        <div class="eyebrow" id="eyebrow"></div>
        <div class="month" id="monthbar">
          <button class="icon-btn" data-action="prev-month" aria-label="Previous month">‹</button>
          <button class="month-label" data-action="this-month" id="monthlabel"></button>
          <button class="icon-btn" data-action="next-month" aria-label="Next month">›</button>
        </div>
      </div>
      <button class="icon-btn gear" data-nav="settings" aria-label="Settings">⚙︎</button>
    </header>
    <div id="banner" class="banner" hidden></div>
    <section id="view" tabindex="-1"></section>
  </main>
  <nav class="tabbar" id="tabbar" aria-label="Main"></nav>
  <button class="fab" data-action="add" aria-label="Add expense">＋</button>
</div>

<div id="login" class="login" hidden>
  <form id="loginform">
    <img src="/icons/icon-192.png" alt="" width="64" height="64">
    <h1>Budget</h1>
    <input type="password" name="password" placeholder="Password" autocomplete="current-password" required>
    <button class="btn primary" type="submit">Unlock</button>
    <p class="err" id="loginerr"></p>
  </form>
</div>

<dialog id="sheet" class="sheet"></dialog>
<div id="tip" class="tip" role="status" hidden></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script type="module" src="/app.js"></script>
</body>
</html>
